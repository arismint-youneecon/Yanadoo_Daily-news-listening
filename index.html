<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아침 영어 뉴스 클럽</title>
<meta name="description" content="매일 아침 영어 뉴스 브리핑을 듣고 함께 공부하는 동아리 앱">
<meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111715" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어뉴스클럽">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* Layout: one phone-first column, sticky top bar and bottom tab bar; English script set in a reading serif */
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#16201D; --muted:#5B6863; --faint:#8A9590; --line:#DCE3E0;
  --accent:#1E6B5C; --accent-ink:#FFFFFF; --accent-bg:#E1EFEB;
  --g-bg:#FAECE7; --g-ink:#993C1D; --k-bg:#E1F5EE; --k-ink:#0F6E56;
  --warn-bg:#FBEFD9; --warn-ink:#7A4A06; --danger:#A32D2D; --danger-bg:#FCEBEB;
  --chip:#ECF0EE; --ok:#1E6B5C;
  --f-ui:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  --f-en:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --card:#19211F; --ink:#E6ECEA; --muted:#9DABA6; --faint:#71807A; --line:#2B3633;
  --accent:#7CC7B4; --accent-ink:#0E1513; --accent-bg:#1C332D;
  --g-bg:#4A2416; --g-ink:#F5C4B3; --k-bg:#0C3B31; --k-ink:#9FE1CB;
  --warn-bg:#3D2C0C; --warn-ink:#F0C877; --danger:#F09595; --danger-bg:#4A1B1B;
  --chip:#222C29; --ok:#7CC7B4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --card:#19211F; --ink:#E6ECEA; --muted:#9DABA6; --faint:#71807A; --line:#2B3633;
  --accent:#7CC7B4; --accent-ink:#0E1513; --accent-bg:#1C332D;
  --g-bg:#4A2416; --g-ink:#F5C4B3; --k-bg:#0C3B31; --k-ink:#9FE1CB;
  --warn-bg:#3D2C0C; --warn-ink:#F0C877; --danger:#F09595; --danger-bg:#4A1B1B;
  --chip:#222C29; --ok:#7CC7B4; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:13px;color:var(--muted)}
main{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:flex}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;font-size:11px;color:var(--faint);text-decoration:none}
.tabs a i{font-size:22px}
.tabs a[aria-current="page"]{color:var(--accent)}

h1{font-size:20px;line-height:1.35;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:15px;margin:0;color:var(--muted);font-weight:500}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.02em;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px 16px}
.row{display:flex;align-items:center;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* briefing cards */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:inherit}
.item:active{background:var(--chip)}
.tile{flex:0 0 44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:22px}
.g .tile{background:var(--g-bg);color:var(--g-ink)} .k .tile{background:var(--k-bg);color:var(--k-ink)}
.txt{min-width:0;flex:1}
.hl{display:block;font-family:var(--f-en);font-weight:600;font-size:16px;line-height:1.35}
.sub{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.bd{display:inline-block;font-size:11px;line-height:1.5;padding:0 7px;border-radius:5px;margin-right:6px;background:var(--chip);color:var(--muted);vertical-align:1px}
.bd.g{background:var(--g-bg);color:var(--g-ink)} .bd.k{background:var(--k-bg);color:var(--k-ink)}
.bd.done{background:var(--accent-bg);color:var(--accent)}
.chev{color:var(--faint);font-size:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:15px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.btn:focus-visible,.tabs a:focus-visible,.item:focus-visible,.w:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[aria-expanded="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.toggles{display:flex;gap:8px;flex-wrap:wrap}

/* login */
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.login input{width:100%;font:inherit;font-size:22px;letter-spacing:.18em;text-transform:uppercase;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.err{color:var(--danger);font-size:14px;min-height:1.4em;margin:0}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:13px}

/* player */
audio{width:100%}
.speeds{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* script */
.script p{font-family:var(--f-en);font-size:18px;line-height:1.8;margin:0 0 14px}
.w{cursor:pointer;border-radius:3px}
.w.gl{border-bottom:1px dotted var(--faint)}
.w.on{background:var(--accent-bg);color:var(--accent)}
.info{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--chip);border-radius:10px;padding:10px 12px;margin:-6px 0 14px;font-family:var(--f-ui)}
.iw{font-weight:700;font-size:15px}
.im{font-size:14px;color:var(--muted);flex:1 1 140px}
.tr p{margin:0 0 10px;line-height:1.8}
.kw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:9px 12px}
.kw .en{font-family:var(--f-en);font-weight:600;font-size:16px}
.kw .ko{color:var(--muted)}
.hint{font-size:12px;color:var(--faint);margin:0 0 10px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal span{aspect-ratio:1;border-radius:5px;background:var(--chip);display:grid;place-items:center;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.cal span.on{background:var(--accent);color:var(--accent-ink)}
.cal span.today{outline:2px solid var(--accent);outline-offset:-2px}
.calh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;font-size:11px;color:var(--faint);text-align:center}

/* admin */
.mem{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mem + .mem{border-top:1px solid var(--line)}
.mem .top-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mem .nm{font-weight:700}
.dots{display:flex;gap:3px}
.dots i{width:12px;height:12px;border-radius:3px;background:var(--chip);display:block}
.dots i.on{background:var(--accent)}
.nums{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nums b{color:var(--ink);font-weight:700}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form input[type=text]{flex:1 1 160px;min-width:0;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.codebox{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.15em;background:var(--accent-bg);color:var(--accent);border-radius:10px;padding:10px 12px;text-align:center;user-select:all}
.empty{padding:24px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><span class="brand" id="brand">아침 영어 뉴스 클럽</span><span class="who" id="who"></span></div></header>
<main id="app" aria-live="polite"><p class="muted">불러오는 중…</p></main>
<nav class="tabs" id="tabs" hidden aria-label="메뉴"><div class="tabs-in">
  <a href="#/" data-tab="today"><i class="ti ti-headphones" aria-hidden="true"></i>오늘</a>
  <a href="#/archive" data-tab="archive"><i class="ti ti-calendar" aria-hidden="true"></i>지난 브리핑</a>
  <a href="#/me" data-tab="me"><i class="ti ti-chart-dots" aria-hidden="true"></i>내 기록</a>
  <a href="#/admin" data-tab="admin" id="adminTab" hidden><i class="ti ti-users" aria-hidden="true"></i>관리</a>
</div></nav>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
